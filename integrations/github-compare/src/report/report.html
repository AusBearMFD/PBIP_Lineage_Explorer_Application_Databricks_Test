<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBIP Compare</title>
<style>/*__CSS__*/</style>
<style>
  /* Report shell, styled with the Lineage Explorer's own tokens. */
  body { display: flex; flex-direction: column; }
  .rc-head { flex: none; padding: 12px 20px 0; background: var(--bg-toolbar); border-bottom: 1px solid var(--border-color); }
  .rc-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .rc-repo { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .rc-range { font-family: Consolas, ui-monospace, monospace; font-size: 13px; color: var(--text-primary); }
  .rc-meta { font-size: 12px; color: var(--text-muted); }
  .rc-why { margin-top: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .rc-warn { margin-top: 8px; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; color: #ffe0a8; background: rgba(255, 183, 77, .14); border: 1px solid rgba(255, 183, 77, .35); }
  .rc-tabs { display: flex; gap: 4px; margin-top: 10px; }
  .rc-tab { font: inherit; font-size: 13px; padding: 8px 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; }
  .rc-tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
  .rc-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rc-body { flex: 1; min-height: 0; position: relative; }
</style>
</head>
<body>
  <header class="rc-head">
    <div class="rc-title">
      <span class="rc-repo" id="rc-repo"></span>
      <span class="rc-range" id="rc-range"></span>
      <span class="rc-meta" id="rc-meta"></span>
    </div>
    <div class="rc-why" id="rc-why"></div>
    <div id="rc-warnings"></div>
    <div class="rc-tabs" role="tablist">
      <button type="button" class="rc-tab" role="tab" id="tab-compare" aria-selected="true">Version Compare</button>
      <button type="button" class="rc-tab" role="tab" id="tab-diagram" aria-selected="false">Model Diagram</button>
    </div>
  </header>
  <main class="rc-body">
    <div id="version-compare-container" class="change-history-container version-compare-container"></div>
    <div id="model-diagram-container" class="change-history-container model-diagram-container hidden"></div>
  </main>
  <script type="application/octet-stream" id="pbip-compare-payload" data-encoding="gzip+base64">__PAYLOAD__</script>
  <script type="module">/*__APP__*/</script>
</body>
</html>
